name: Build & Release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to merge from (default: develop)"
        required: false
        default: "develop"

jobs:
  build:
    name: Build → Deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}

      # ── 2. Setup Node.js with npm cache ─────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      # ── 3. Install dependencies ─────────────────────────────────────────
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # ── 4. Build ────────────────────────────────────────────────────────
      - name: Build
        working-directory: app
        run: npm run build

      # ── 5. Upload Pages artifact ─────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
