name: Build & Release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to merge from (default: develop)"
        required: false
        default: "develop"

jobs:
  build:
    name: Merge → Build → Export
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout release branch ──────────────────────────────────────
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0          # full history needed for merge

      # ── 2. Merge develop → release ──────────────────────────────────────
      - name: Merge from develop (or specified branch)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.event.inputs.source_branch }}
          git merge --no-ff origin/${{ github.event.inputs.source_branch }} \
            -m "chore: merge ${{ github.event.inputs.source_branch }} into release [skip ci]"

      # ── 3. Setup Node.js with npm cache ─────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      # ── 4. Install dependencies ─────────────────────────────────────────
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # ── 5. Type check ───────────────────────────────────────────────────
      - name: TypeScript type check
        working-directory: app
        run: npx tsc --noEmit

      # ── 6. Build ────────────────────────────────────────────────────────
      - name: Build
        working-directory: app
        run: npm run build

      # ── 7. Export dist → /output ─────────────────────────────────────────
      - name: Copy dist to /output
        run: |
          rm -rf output
          mkdir -p output
          cp -r app/dist/. output/

      # ── 8. Commit output back to release branch ──────────────────────────
      - name: Commit output
        run: |
          git add output/
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to output — skipping commit."
          else
            git commit -m "build: update output from ${{ github.event.inputs.source_branch }} [skip ci]"
            git push origin release
          fi

      # ── 9. Upload as Actions artifact (optional, for quick inspection) ───
      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: output/
          retention-days: 14
