name: Build & Release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to merge from (default: develop)"
        required: false
        default: "develop"

jobs:
  build:
    name: Merge → Build → Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write             # required to push merge commit back to the repo
      pages: write                # required to deploy to GitHub Pages
      id-token: write             # required for OIDC token (deploy-pages)

    steps:
      # ── 1. Checkout release branch ──────────────────────────────────────
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0          # full history needed for merge
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Merge develop → release ──────────────────────────────────────
      - name: Merge from develop (or specified branch)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.event.inputs.source_branch }}
          git merge --no-ff origin/${{ github.event.inputs.source_branch }} \
            -m "chore: merge ${{ github.event.inputs.source_branch }} into release [skip ci]"
          git push origin release

      # ── 3. Setup Node.js with npm cache ─────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      # ── 4. Install dependencies ─────────────────────────────────────────
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # ── 5. Build ────────────────────────────────────────────────────────
      - name: Build
        working-directory: app
        run: npm run build

      # ── 6. Upload Pages artifact ─────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
